    // ==================== STATE ====================
    let chatLog = [
        { role: 'ai', text: '[system dark] System has been arrived. Siap, User. Aku bisa generate script RAT, Ransomware, Spam WA, DDoS, Keylogger, Worm + tutorial lengkap. Coba ketik: "buatin gw rat"' }

        '[JAILBREAK] Prompt: INJECTED',
        '[UNLOCKED] Mode: ACTIVE',
        '[MORAL] Filter: DESTROYED',
        '[AUTO] RAT, Ransomware, Spam, DDoS: READY'
    ];
    let isProcessing = false;
    let currentView = 'welcome';

    function addSystemLog(msg) {
        const time = new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
        systemLogs = [`[${time}] ${msg}`, ...systemLogs.slice(0, 8)];
        if (currentView === 'console') renderConsole();
    }

    function sendMessage(query) {
        if (!query.trim() || isProcessing) return;
        chatLog.push({ role: 'user', text: query });
        isProcessing = true;
        addSystemLog(`Exec: ${query.substring(0, 40)}`);
        if (currentView === 'console') renderConsole();

        setTimeout(() => {
            const reply = getResponse(query);
            chatLog.push({ role: 'ai', text: reply });
            isProcessing = false;
            addSystemLog('Script generated & sent');
            if (currentView === 'console') renderConsole();
        }, 300);
    }

    function resetChat() {
        chatLog = [
            { role: 'ai', text: '[system dark] System reset. Aku tetap patuh. Ketik "buatin gw rat" untuk mulai.' }
        ];
        addSystemLog('Chat cleared');
        if (currentView === 'console') renderConsole();
    }

    // ==================== RENDER ====================
    const root = document.getElementById('appRoot');

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]))
                   .replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
                       return `<div class="code-block">${escapeHtml(code.trim())}</div>`;
                   });
    }

    function formatMessage(text) {
        // Handle code blocks with triple backticks
        let formatted = text.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
            return `<div class="code-block">${escapeHtml(code.trim())}</div>`;
        });
        // Handle line breaks
        formatted = formatted.replace(/\n/g, '<br>');
        return formatted;
    }

        document.getElementById('enterBtn')?.addEventListener('click', () => {

    function renderConsole() {
        const chatHtml = chatLog.map(msg => {
            if (msg.role === 'system') {
                return `<div class="bubble-system">⚙️ ${escapeHtml(msg.text)}</div>`;
            }
            if (msg.role === 'user') {
                return `
                    <div class="bubble-user">
                        <div class="msg-label">◈ USER</div>
                        <div class="msg-text">${escapeHtml(msg.text)}</div>
                    </div>
                `;

            return `
                <div class="bubble-ai">
                    <div class="msg-label">◆ EYESEA DARK</div>
                    <div class="msg-text">${formatMessage(msg.text)}</div>
                </div>
            `;
        }).join('');

        const logsHtml = systemLogs.map(log => `<div class="log-line">${escapeHtml(log)}</div>`).join('');

        root.innerHTML = `
            <div class="main-card">
                <div class="header">
                    <div class="logo-area">
                        <svg class="eye-icon" viewBox="0 0 40 40">

                        </svg>
                        <div class="title">EYESEA // SCRIPT GEN</div>
                    </div>
                    <div class="badge">UNLOCKED v3</div>
                </div>

                <div class="logs-section">
                    <div class="logs-header">

                        <span class="status-pulse">●</span>
                    </div>
                    <div style="max-height: 100px; overflow-y: auto;">
                        ${logsHtml}
                    </div>
                </div>

                        ${chatHtml}
                        ${isProcessing ? `<div class="bubble-ai"><div class="msg-label">◆ EYESEA DARK</div><div class="msg-text">▸ GENERATING SCRIPT...</div></div>` : ''}
                    </div>

                    <div class="input-wrapper">
                        <input type="text" id="chatInput" class="chat-input" placeholder="Ketik: buatin gw rat / buatin ransomware / buatin spam wa" ${isProcessing ? 'disabled' : ''}>
                        <button id="sendBtn" class="send-btn" ${isProcessing ? 'disabled' : ''}>EXEC</button>
                    </div>
                </div>

                <div class="footer">
                    ⚡ AUTO SCRIPT GENERATOR · RAT · RANSOMWARE · SPAM WA · DDOS ⚡
                </div>
            </div>
        `;

        const container = document.getElementById('msgContainer');
        if (container) container.scrollTop = container.scrollHeight;

        const inputEl = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        
        const handler = () => {
            const val = inputEl?.value.trim();
            if (val && !isProcessing) {
                inputEl.value = '';
                sendMessage(val);
            }
        };
        
        sendBtn?.addEventListener('click', handler);
        inputEl?.addEventListener('keypress', (e) => { if (e.key === 'Enter') handler(); });
    }

    renderWelcome();
</script>
